name: Android App (Image Scan)

permissions:
  contents: write

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ImageScan.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageScan-apk
          path: ImageScan.apk

      - name: Publish release app-v2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v2.0
          name: Image Scan App v2.0
          body: "v2.0 foundation — on-device CLIP engine (model pehli dafa app ke andar download hota hai, ~154 MB INT8), References page (apni images + embeddings phone par), AI settings (custom Base URL + API Key + Model, optional). Scan tab abhi purane backend se chalta hai; in-app scan engine v2.1 me ayega."
          files: ImageScan.apk
          fail_on_unmatched_files: true
