<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Image Search</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --line:#2a2f3a; --txt:#e8eaf0; --dim:#9aa3b2; --acc:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--txt); }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; }
  .controls { padding: 10px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; }
  input[type="text"] { flex:1; padding: 11px 12px; border-radius: 10px; border:1px solid var(--line);
                       background: var(--card); color: var(--txt); font-size: 15px; min-width: 0; }
  button { padding: 11px 16px; border: 0; border-radius: 10px; background: var(--acc);
           color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(.98); }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center;
          color: var(--dim); background: var(--card); cursor: pointer; }
  .drop img { max-height: 110px; border-radius: 8px; display: none; margin: 6px auto 0; }
  .status { padding: 2px 16px 8px; color: var(--dim); font-size: 13px; min-height: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 10px; padding: 8px 12px 28px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; position: relative; }
  .card img { width: 100%; height: 130px; object-fit: cover; display: block; background: #000; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.78); color: #7ee787;
           font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .meta { padding: 8px 10px 10px; }
  .title { font-size: 12.5px; line-height: 1.35; height: 34px; overflow: hidden;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .open { display: inline-block; margin-top: 7px; font-size: 12.5px; color: var(--acc);
          text-decoration: none; font-weight: 600; }
  .spinner { display:none; margin: 18px auto; width: 34px; height: 34px; border-radius: 50%;
             border: 4px solid var(--line); border-top-color: var(--acc);
             animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🔎 Visual Image Search</h1>
  <div class="sub">Search your own indexed images — by picture or by words. Runs 100% on this phone.</div>
</header>

<div class="controls">
  <div class="row">
    <input id="q" type="text" placeholder="Describe an image… e.g. red sunset over mountains">
    <button id="textBtn" type="button">Search</button>
  </div>
  <div class="drop" id="drop">
    📷 Tap to upload a reference image (or drop it here)
    <img id="preview" alt="query preview">
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</div>

<div class="spinner" id="spinner"></div>
<div class="status" id="status"></div>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const spinner = document.getElementById('spinner');
const q = document.getElementById('q');
const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const preview = document.getElementById('preview');

function setLoading(on, msg) {
  spinner.style.display = on ? 'block' : 'none';
  statusEl.textContent = msg || '';
}

function render(results) {
  grid.innerHTML = '';
  if (!results.length) { statusEl.textContent = 'No results.'; return; }
  statusEl.textContent = results.length + ' result(s)';
  for (const r of results) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = r.thumb_url;
    img.alt = r.title || 'result';
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = r.score.toFixed(1) + '%';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = r.title || '(no title)';
    const link = document.createElement('a');
    link.className = 'open';
    link.href = r.source_url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Open source ↗';
    meta.appendChild(title);
    meta.appendChild(link);
    card.appendChild(img);
    card.appendChild(badge);
    card.appendChild(meta);
    grid.appendChild(card);
  }
}

async function runSearch(url, options) {
  setLoading(true, 'Searching…');
  grid.innerHTML = '';
  try {
    const resp = await fetch(url, options);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
    render(data);
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    spinner.style.display = 'none';
  }
}

document.getElementById('textBtn').addEventListener('click', () => {
  const text = q.value.trim();
  if (text) runSearch('/search?q=' + encodeURIComponent(text) + '&k=50');
});
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('textBtn').click(); });

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); });
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) searchWithFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) searchWithFile(fileInput.files[0]);
});

function searchWithFile(file) {
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  const form = new FormData();
  form.append('file', file);
  runSearch('/search?k=50', { method: 'POST', body: form });
}
</script>
</body>
</html>
