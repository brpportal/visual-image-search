<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAN — One Search, Overall Social Media Scan</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #101318; color: #e8ecf1; }
  header { padding: 18px 16px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0; color: #9aa7b5; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 14px 16px; }
  input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2a3342; background: #171c24; color: #fff; font-size: 16px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: #22c55e; color: #06280f; font-weight: 700; font-size: 16px; }
  #status { padding: 0 16px 10px; color: #fbbf24; font-size: 14px; min-height: 20px; }
  #counts { padding: 0 16px 12px; color: #9aa7b5; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 0 16px 24px; }
  .card { background: #171c24; border: 1px solid #232c3a; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; height: 130px; object-fit: cover; display: block; background: #0b0e13; }
  .meta { padding: 8px; font-size: 12px; }
  .score { color: #4ade80; font-weight: 700; }
  .origin { display: inline-block; background: #1e293b; border-radius: 6px; padding: 1px 6px; margin-left: 4px; color: #93c5fd; }
  .title { color: #cbd5e1; margin-top: 4px; line-height: 1.3; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>🔎 SCAN — Ek Search, Overall Scan</h1>
  <p class="sub">Web + YouTube + Facebook/Instagram (public OG) — ek waqt me, bina login. Apna crawler + CLIP matching.</p>
</header>
<form id="f">
  <input id="q" placeholder="e.g. Pakistan logo on social media" value="Pakistan logo on social media">
  <button>Scan</button>
</form>
<div id="status"></div>
<div id="counts"></div>
<div class="grid" id="grid"></div>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'),
      status = document.getElementById('status'), counts = document.getElementById('counts'),
      grid = document.getElementById('grid');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  status.textContent = 'Scan chal raha hai… (30-90 sec lag sakte hain)';
  counts.textContent = ''; grid.innerHTML = '';
  try {
    const r = await fetch('/scan?q=' + encodeURIComponent(q.value));
    const data = await r.json();
    if (data.error) { status.textContent = 'Error: ' + data.error; return; }
    status.textContent = 'Scan mukammal ✅';
    const c = data.counts || {};
    counts.textContent = 'Harvest: ' + Object.entries(c).map(([k, v]) => k + ' ' + v).join(' · ') +
      ' | kul ' + data.total + ' images check huin';
    for (const item of data.results) {
      const a = document.createElement('a');
      a.href = item.source_url; a.target = '_blank';
      a.innerHTML = '<div class="card"><img loading="lazy" src="' + item.thumb_url + '">' +
        '<div class="meta"><span class="score">' + item.score + '%</span>' +
        '<span class="origin">' + item.origin + '</span>' +
        '<div class="title">' + (item.title || '').slice(0, 60) + '</div></div></div>';
      grid.appendChild(a);
    }
  } catch (err) { status.textContent = 'Network error: ' + err; }
});
</script>
</body>
</html>
